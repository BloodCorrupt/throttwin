[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "throttwin"
version = "2.0.0"
description = "A Windows tool to limit the bandwidth of any device on your local network, no router access required."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "scapy>=2.5.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
    "psutil>=5.9.0",
    "pyfiglet>=1.0.2",
    "Flask>=3.0.0",
]

[project.scripts]
throttwin = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "web*"]

[tool.setuptools.package-data]
core = ["oui_db.json"]
web = ["templates/*", "static/**/*"]

